services:
  # Node.js + Express Backend Web Service
  - type: web
    name: ronojobs-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ronojobs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  # Managed PostgreSQL Database on Render
  - name: ronojobs-db
    databaseName: ronojobs
    user: ronojobs_user
    plan: free
